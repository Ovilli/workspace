#launch-progress {
    max-width: 600px;
    margin: 1em auto;
}

    padding: 1.25em;
    box-shadow: 0 0.25em 0.75em rgba(0, 0, 0, 0.1);
    background: #fff;
}

    background-color: #eee;
}
#launch-progress .progress-bar {
    transition: width 0.4s ease;
    line-height: 1.5em;
    font-weight: 600;
    min-width: 2.5em;
    background-color: #428bd4;
}
.launch-progress-header {
    display: flex;

    gap: 0.3em;

    border-radius: 0.5em;

.launch-step i {
    font-size: 1em;

}
.launch-step.active {

    font-weight: 600;

.launch-step.done {
    color: #73a946;
}
.launch-step.failed {

}
.launch-step-connector {

    height: 2px;
    background: #ddd;

<script>

function install_clipboard_handler(selector) {
    window.clipboard = new ClipboardJS(selector);
    window.clipboard.on('success', function(e) {
        let check = $("<i class='bi bi-check-lg btn-clipboard-check' style='position: absolute; left: 0.7em; top: 0.4em;'/>");
        $(e.trigger).removeClass('btn-secondary').addClass('btn-success');
        $(e.trigger).closest('.btn').find('.bi-copy').css('visibility', 'hidden');
        $(e.trigger).append(check);
        (function(check, trigger) {
            setTimeout(function() {
                check.fadeOut(400, function() {
                    trigger.addClass('btn-secondary').removeClass('btn-success');
                    trigger.closest('.btn').find('.bi-copy').css('visibility', 'visible');
                    check.remove();
                });
            }, 1000);
        })(check, $(e.trigger));
    });
}

function showTemplateModal(title, text, confirm_label, confirm_class,
    cancel_label, cancel_class, confirm_callback) {
    $('#__template_modal .modal-title').html(title);
    $('#__template_modal .modal-body').html(text);
    let bu_confirm = $('<button>').addClass('btn ' + confirm_class).html(confirm_label);
    $('#__template_modal .modal-footer').empty().append(bu_confirm);
    if (cancel_label !== null) {
        let bu_cancel = $('<button>').addClass('btn ' + cancel_class).html(cancel_label).attr('data-dismiss', 'modal');
        $('#__template_modal .modal-footer').append(bu_cancel);
        bu_cancel.on('click', function(e) {
            $('#__template_modal').modal('hide');
        });
    }
    bu_confirm.click(function(e) {
        if (confirm_callback() !== false) {
            console.log('hiding!');
            $('#__template_modal').modal('hide');
        }
    });
    $('#__template_modal').modal('show');
}

var server_tag = "#{(@session_user || {})[:server_tag]}";

var launch_progress_steps = [
    { pct: 0, label: 'Warteschlange', icon: 'bi-clock' },
    { pct: 10, label: 'Vorbereitung', icon: 'bi-folder' },
    { pct: 25, label: 'Konfiguration', icon: 'bi-gear' },
    { pct: 45, label: 'Container starten', icon: 'bi-box' },
    { pct: 70, label: 'Netzwerk', icon: 'bi-diagram-3' },
    { pct: 90, label: 'Warten auf Workspace', icon: 'bi-hourglass' },
    { pct: 100, label: 'Bereit!', icon: 'bi-check-circle' },
];

function get_step_for_progress(pct) {
    let idx = 0;
    for (let i = launch_progress_steps.length - 1; i >= 0; i--) {
        if (pct >= launch_progress_steps[i].pct) { idx = i; break; }
    }
    return idx;
}

function update_launch_progress_ui(pct, message, status, error) {
    let step_idx = get_step_for_progress(pct);
    let elapsed = 0;
    if (window._launch_start_time) {
        elapsed = Math.floor((Date.now() - window._launch_start_time) / 1000);
    }

    if (pct > 0 && !window._progress_bar_shown) {
        window._progress_bar_shown = true;
        $('#launch-progress').slideDown(300);
    }

    let bar = $('#launch-progress-bar');
    bar.css('width', Math.min(pct, 100) + '%');
    bar.text(pct + '%');
    bar.attr('aria-valuenow', pct);
    bar.toggleClass('progress-bar-animated', status === 'queued' || status === 'running');
    bar.toggleClass('progress-bar-striped', status === 'queued' || status === 'running');
    bar.toggleClass('bg-success', status === 'ready');
    bar.toggleClass('bg-danger', status === 'failed');

    let msg = '';
    if (status === 'failed') {
        msg = error || 'Fehler beim Starten';
    } else if (pct < 100) {
        msg = message || 'Wird gestartet...';
    } else {
        msg = 'Workspace ist bereit!';
    }
    $('#launch-progress-message').text(msg);

    let time_str = '';
    if (elapsed > 0) {
        if (elapsed < 60) {
            time_str = elapsed + 's';
        } else {
            time_str = Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's';
        }
    }
    $('#launch-progress-time').text(time_str);

    launch_progress_steps.forEach(function(step, i) {
        let el = $('#launch-step-' + i);
        if (el.length === 0) {
            el = $('<div>').attr('id', 'launch-step-' + i).addClass('launch-step');
            if (step.pct === 100) el.addClass('last');
            el.append($('<i>').addClass('bi ' + step.icon));
            el.append($('<span>').text(step.label));
            $('#launch-progress-steps').append(el);
            if (i < launch_progress_steps.length - 1) {
                $('#launch-progress-steps').append($('<div>').addClass('launch-step-connector'));
            }
        }
        let is_done = pct >= step.pct || status === 'ready';
        let is_active = i === step_idx && status !== 'ready' && status !== 'failed';
        el.toggleClass('done', is_done);
        el.toggleClass('active', is_active);
        el.toggleClass('failed', status === 'failed' && is_active);
    });
}

function reset_launch_progress() {
    // close any placeholder popup that never got navigated (failure path)
    if (window._launch_win && !window._launch_win.closed) window._launch_win.close();
    window._launch_win = null;
    window._progress_bar_shown = false;
    window._launch_poll_timeout = null;
    window._launch_start_time = null;
    $('#launch-progress').slideUp(300);
    $('#launch-progress-steps').empty();
    $('#launch-progress-bar').css('width', '0%').text('0%').removeClass('bg-success bg-danger progress-bar-animated progress-bar-striped');
    $('#launch-progress-message').text('');
    $('#launch-progress-time').text('');
    $('#bu_launch').prop('disabled', false);
    $('#bu_launch .bi').removeClass('bi-spin');
    $('#bu_launch_share').prop('disabled', false);
    $('#bu_launch_share .bi').removeClass('bi-spin');
    $('.bu-launch-test').prop('disabled', false);
    $('.bu-launch-test .bi').removeClass('bi-spin');
    $('.bu-open-workspace-as-admin').prop('disabled', false);
    $('.bu-open-workspace-as-admin .bi').removeClass('bi-spin');
}

function poll_server_start_progress(server_tag, params, watch) {
    if (typeof(watch) === 'undefined') watch = false;

    let max_attempts = 120;
    let attempt = 0;

    function tick() {
        attempt++;
        if (attempt > max_attempts) {
            update_launch_progress_ui(0, 'Zeitüberschreitung', 'failed', 'Der Startvorgang dauert zu lange. Bitte versuche es erneut.');
            reset_launch_progress();
            return;
        }

        api_call('/api/server_start_status', params || {}, function(data) {
            let pct = data.progress || 0;
            let msg = data.progress_message || '';
            let st = data.status || 'unknown';
            let err = data.error || null;

            update_launch_progress_ui(pct, msg, st, err);

            if (st === 'ready') {
                poll_workspace_online(server_tag, watch);
            } else if (st === 'failed') {
                update_launch_progress_ui(0, err || 'Fehler beim Starten', 'failed');
                reset_launch_progress();
            } else {
                window._launch_poll_timeout = setTimeout(tick, 800);
            }
        }, function(err) {
            if (attempt < max_attempts) {
                window._launch_poll_timeout = setTimeout(tick, 1000);
            } else {
                update_launch_progress_ui(0, 'Verbindungsfehler', 'failed');
                reset_launch_progress();
            }
        });
    }

    tick();
}

// Open a placeholder tab synchronously inside a click handler so the browser
// keeps the popup permission (user activation). The tab is navigated to the
// real workspace URL later, once the container is confirmed online.
function open_launch_window() {
    try {
        window._launch_win = window.open('about:blank', '_blank');
        if (window._launch_win) {
            window._launch_win.document.write(
                '<!doctype html><meta charset="utf-8"><title>Workspace startet…</title>' +
                '<body style="font-family:sans-serif;display:flex;align-items:center;' +
                'justify-content:center;height:100vh;margin:0;color:#555">' +
                'Workspace startet…</body>');
        }
    } catch (e) { window._launch_win = null; }
}

function poll_workspace_online(server_tag, watch) {
    let url = `#{WEB_ROOT}/w/${server_tag}/`;
    let max_attempts = 40;

    function tick(attempt) {
        fetch(url, {credentials: 'include'})
        .then(response => {
            if (response.status === 200) {
                update_launch_progress_ui(100, 'Workspace ist bereit!', 'ready');
                $('#launch-progress-bar').addClass('bg-success');
                setTimeout(function() {
                    let workspace_url = `#{WEB_ROOT}`.replace('//', `//${server_tag}.`);
                    if (window._launch_win && !window._launch_win.closed) {
                        window._launch_win.location = workspace_url; // reuse gesture-born tab
                    } else {
                        window.open(workspace_url, '_blank'); // fallback (may be blocked)
                    }
                    window._launch_win = null;
                    reset_launch_progress();
                }, 500);
            } else {
                if (attempt < max_attempts) {
                    setTimeout(function() { tick(attempt + 1); }, 500);
                } else {
                    update_launch_progress_ui(95, 'Workspace reagiert nicht', 'failed', 'Der Container läuft, aber der Workspace antwortet nicht.');
                    reset_launch_progress();
                }
            }
        })
        .catch(error => {
            if (attempt < max_attempts) {
                setTimeout(function() { tick(attempt + 1); }, 500);
            } else {
                update_launch_progress_ui(95, 'Verbindungsfehler', 'failed', 'Konnte keine Verbindung zum Workspace herstellen.');
                reset_launch_progress();
            }
        });
    }

    tick(0);
}

// backward compatibility for share.html and admin.html
function check_server_online(server_tag, watch) {
    poll_workspace_online(server_tag, watch);
}

function check_server_tag_update(server_tag) {
    let stored_server_tag = localStorage.getItem('server_tag');
    if (server_tag !== stored_server_tag) {
        console.log('Server tag has changed, purging indexed DB...');
        (async () => {
            const dbs = await window.indexedDB.databases();
            dbs.forEach(db => { window.indexedDB.deleteDatabase(db.name) });
        })();
        localStorage.setItem('server_tag', server_tag);
    }
}

var autotoc_containers = [];
var autotoc_items = [];
var autotoc_items_visible = [];
var autotoc = null;
var autotoc_showing = false;
var got_autotoc = false;

function install_autotoc() {
    autotoc = $('.autotoc');
    got_autotoc = $('.autotoc-container').toArray().length > 0;

    function fix_autotoc() {
        if (window.scrollY < 100) {
            autotoc_showing = false;
        } else {
            if (window.scrollY > window.innerHeight * 0.3) autotoc_showing = true;
        }
        autotoc.toggleClass('hidden', !autotoc_showing);
    }

    if (got_autotoc) {
        window.addEventListener('scroll', function(e) {
            fix_autotoc();
        });
        fix_autotoc();
    }
    let observer = new IntersectionObserver((entries, observer) => {
        let found_entry = false;
        entries.forEach(entry => {
            let index = $(entry.target).data('autotoc-index');
            autotoc_items_visible[index] = entry.isIntersecting;
        });
        for (let i = 0; i < autotoc_containers.length; i++) {
            let item = autotoc_items[i];
            $(item).removeClass('active');
            if (autotoc_items_visible[i]) {
                found_entry = true;
                let container = $(item).parent()[0];
                container.scrollTo({ left: item.offsetLeft - (container.offsetWidth / 2) + (item.offsetWidth / 2), behavior: 'smooth' });
                $('.progress_spots_lg')[0].scrollTo({ left: item.offsetLeft - (container.offsetWidth / 2) + (item.offsetWidth / 2), behavior: 'smooth' });
                $('.progress_spots_lg').find('div').removeClass('active');
                $('.progress_spots_lg').find('div').eq(i).addClass('active');
                $('.autotoc .progress_sm').css('left', `${100.0 * i / autotoc_containers.length}%`);
                $(item).addClass('active');
            }
        }
    }, { root: null, rootMargin: '-30% 0% -70% 0%' });
    let containers = $('.autotoc-container').toArray();
    for (let i = 0; i < containers.length; i++) {
        let div = $(containers[i]);
        div.data('autotoc-index', i);
        autotoc_containers.push(div[0]);
        let item = $('<div>').text(div.data('label'));
        item.data('autotoc-index', i);
        item[0].addEventListener('click', function(e) {
            $('html')[0].scrollTop = $(containers[i]).find('h2')[0].offsetTop - 80;
        });
        autotoc_items.push(item[0]);
        autotoc_items_visible.push(false);
        $('.autotoc > .items').append(item);
        observer.observe(div[0]);
        let spot_sm = $('<div>');
        spot_sm.css('width', `${100.0 / containers.length}%`);
        spot_sm.appendTo($('.autotoc > .progress_spots_sm'));
        let spot_lg = $('<div>');
        spot_lg.appendTo($('.autotoc > .progress_spots_lg'));
    }
    $('.autotoc .progress_sm').css('width', `calc(${100.0 / autotoc_containers.length}% - 0.3em)`);
}

var brightness = `#{((@session_user || {})[:brightness] || 'auto')}`;
var system_brightness = 'light';
var dark_css_element = null;

function update_dark_mode() {
    let dark = false;
    if (brightness === 'auto') dark = (system_brightness === 'dark');
    if (brightness === 'light') dark = false;
    if (brightness === 'dark') dark = true;
    if (dark) {
        document.getElementsByTagName('html')[0].setAttribute('data-bs-theme', 'dark');
    } else {
        document.getElementsByTagName('html')[0].setAttribute('data-bs-theme', 'light');
    }
    // if (dark_css_element !== null) {
    //     dark_css_element.remove();
    //     dark_css_element = null;
    // }
    // if (dark) {
    //     dark_css_element = document.createElement('link');
    //     dark_css_element.rel = 'stylesheet';
    //     dark_css_element.href = `/include/dark.css?#{CACHE_BUSTER}`;
    //     document.head.appendChild(dark_css_element);
    // }
}

window.addEventListener('DOMContentLoaded', function() {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        system_brightness = 'dark';
    }
    update_dark_mode();
    window.matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change',({ matches }) => {
        if (matches) {
            system_brightness = 'dark';
            update_dark_mode();
        } else {
            system_brightness = 'light';
            update_dark_mode();
        }
    });
});

window.addEventListener('load', function() {
    install_clipboard_handler('.btn-clipboard');
    // check if the server tag has changed
    if ('#{user_logged_in?}' === 'true') {
        let server_tag = '#{(@session_user || {})[:server_tag]}';
        check_server_tag_update(server_tag);
    }

    $('#bu_launch').on('click', function(e) {
        reset_launch_progress();
        open_launch_window();
        $('#bu_launch').prop('disabled', true);
        $('#bu_launch .bi').addClass('bi-spin');
        window._launch_start_time = Date.now();
        api_call('/api/start_server', {}, function(data) {
            console.log(data);
            check_server_tag_update(data.server_tag);
            if (data.status === 'ready') {
                poll_workspace_online(data.server_tag);
            } else {
                poll_server_start_progress(data.server_tag, {});
            }
        }, function(err) {
            update_launch_progress_ui(0, 'Verbindungsfehler', 'failed', 'Der Server antwortet nicht. Bitte versuche es erneut.');
            reset_launch_progress();
        });
    });
    $('.bu-launch-test').on('click', function(e) {
        let button = $(e.target).closest('button');
        let test_tag = button.data('tag');
        reset_launch_progress();
        open_launch_window();
        button.prop('disabled', true);
        button.find('.bi').addClass('bi-spin');
        window._launch_start_time = Date.now();
        api_call('/api/start_server', {test_tag: test_tag}, function(data) {
            console.log(data);
            check_server_tag_update(data.server_tag);
            if (data.status === 'ready') {
                poll_workspace_online(data.server_tag);
            } else {
                poll_server_start_progress(data.server_tag, {test_tag: test_tag});
            }
        }, function(err) {
            update_launch_progress_ui(0, 'Verbindungsfehler', 'failed', 'Der Server antwortet nicht. Bitte versuche es erneut.');
            reset_launch_progress();
        });
    });
    $('#bu_reset').on('click', function(e) {
        showTemplateModal('Workspace zurücksetzen', 'Bist du sicher, dass du deinen Workspace zurücksetzen möchtest? Alle Dateien und deine installierten Erweiterungen werden gelöscht.',
        "<i class='bi bi-trash-fill'></i>Zurücksetzen", 'btn-danger', "<i class='bi bi-x-lg'></i>Abbruch", 'btn-secondary', function() {
            api_call('/api/reset_server', {}, function(data) {
                // we need to reload the website to receive the updated server_tag and server_sid
                window.location.reload();
            });
        });
    });
    $('#bu_share').on('click', function(e) {
        showTemplateModal('Workspace teilen', 'Wenn du deinen Workspace teilst, erhältst du einen Link, mit dem man ohne Anmeldung auf deinen Workspace zugreifen kann. Möchtest du deinen Workspace teilen?',
        "<i class='bi bi-share'></i>Workspace teilen", 'btn-primary', "<i class='bi bi-x-lg'></i>Abbruch", 'btn-secondary', function() {
            api_call('/api/share_server', {}, function(data) {
                if (data.success) {
                    $('#ti_share_link').val("#{WEB_ROOT}/share/" + data.share_tag);
                    $('#bu_copy_share_link').attr('data-clipboard-text', "#{WEB_ROOT}/share/" + data.share_tag);
                    $('#div_share_link').slideDown();
                    $('#bu_share').hide();
                    $('#bu_stop_share').show();
                }
            });
        });
    });
    $('#bu_stop_share').on('click', function(e) {
        showTemplateModal('Teilen beenden', 'Bist du sicher, dass du die Teilung aufheben möchtest? Der Link kann dann nicht mehr für den Zugriff auf deinen Workspace verwendet werden.',
        "<i class='bi bi-trash-fill'></i>Teilen beenden", 'btn-primary', "<i class='bi bi-x-lg'></i>Abbruch", 'btn-secondary', function() {
            api_call('/api/unshare_server', {}, function(data) {
                if (data.success) {
                    $('#ti_share_link').val('');
                    $('#div_share_link').slideUp();
                    $('#bu_share').show();
                    $('#bu_stop_share').hide();
                }
            });
        });
    });

    $('#bu_phpmyadmin').on('click', function(e) {
        $('#bu_phpmyadmin').prop('disabled', true);
        $('#bu_phpmyadmin .bi').addClass('bi-spin');
        api_call('/api/start_mysql', {}, function(data) {
            $('#bu_phpmyadmin').prop('disabled', false);
            $('#bu_phpmyadmin .bi').removeClass('bi-spin');
            window.open('#{PHPMYADMIN_WEB_ROOT}', '_blank');
        });
    });

    $('#bu_pgadmin').on('click', function(e) {
        $('#bu_pgadmin').prop('disabled', true);
        $('#bu_pgadmin .bi').addClass('bi-spin');
        api_call('/api/start_postgres', {}, function(data) {
            $('#bu_pgadmin').prop('disabled', false);
            $('#bu_pgadmin .bi').removeClass('bi-spin');
            console.log('#{PGADMIN_WEB_ROOT}');
            window.open('#{PGADMIN_WEB_ROOT}', '_blank');
        });
    });

    $('#bu_neo4j').on('click', function(e) {
        $('#bu_neo4j').prop('disabled', true);
        $('#bu_neo4j .bi').addClass('bi-spin');
        api_call('/api/start_neo4j', {}, function(data) {
            $('#bu_neo4j').prop('disabled', false);
            $('#bu_neo4j .bi').removeClass('bi-spin');
            let url = data.browser_url;
            console.log(url);
            window.open(url, '_blank');
        });
    });

    var isDown = false;
    var startX;
    var scrollLeft;
    var scrollElement = null;
    for (let img of $('.scroll-x img.full')) {
        img = $(img);
        let slider = $(img).parent()[0];
        $(slider).on('mousedown', function(e) {
            e.preventDefault();
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
            scrollElement = slider;
        });
        $('body').on('mouseup', () => {
            if (!isDown) return;
            scrollElement.classList.remove('active');
            isDown = false;
            scrollElement = null;
        });
        $('body').on('mouseleave', () => {
            if (!isDown) return;
            scrollElement.classList.remove('active');
            isDown = false;
            scrollElement = null;
        });
        $('body').on('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - scrollElement.offsetLeft;
            const walk = x - startX;
            scrollElement.scrollLeft = scrollLeft - walk;
        });
    }
    install_autotoc();
});
</script>
